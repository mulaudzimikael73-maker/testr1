backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  # -------------------------
  # Gallery
  # -------------------------
  - name: "gallery"
    label: "📸 Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Caption", name: "caption", widget: "markdown", required: false}

  # -------------------------
  # Videos
  # -------------------------
  - name: "videos"
    label: "🎥 Videos"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Video", name: "video", widget: "file"}
      - {label: "Caption", name: "caption", widget: "markdown", required: false}

  # -------------------------
  # Archives
  # -------------------------
  - name: "archives"
    label: "📁 Archives"
    folder: "content/archives"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "Title", name: "title", widget: "string"}

      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - Photo
          - Video

      - {label: "Photo", name: "image", widget: "image", required: false}
      - {label: "Video", name: "video", widget: "file", required: false}
      - {label: "Story", name: "body", widget: "markdown"}

  # -------------------------
  # Read Me
  # -------------------------
  - name: "readme"
    label: "❤️ Read Me"
    folder: "content/readme"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "Title", name: "title", widget: "string"}

      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - Photo
          - Video

      - {label: "Photo", name: "image", widget: "image", required: false}
      - {label: "Video", name: "video", widget: "file", required: false}
      - {label: "Message", name: "body", widget: "markdown"}

  # -------------------------
  # Settings
  # -------------------------
  - name: "settings"
    label: "⚙️ Settings"

    files:
      - file: "content/settings/readme.md"
        label: "Website Settings"
        name: "settings"

        fields:
          - {label: "Welcome Title", name: "title", widget: "string"}
          - {label: "Welcome Message", name: "body", widget: "markdown"}